[package]
name = "mtreconstruct"
version = "0.1.1"
edition = "2024"
description = "Multi-thread implementation of vm-support -r command."
repository = "https://github.com/ushiba0/mtreconstruct"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1"
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.10.0"
log = "0.4.0"
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.102"
once_cell = "1.21.4"

[profile.dev]
panic = 'abort'

[profile.release]
strip = true
lto = true
codegen-units = 1
