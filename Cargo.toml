[package]
name = "mtreconstruct"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1"
getopts = "0.2"
env_logger = "0.10.0"
log = "0.4.0"
tokio = { version = "1.48.0", features = ["full"] }

[profile.dev]
panic = 'abort'

[profile.release]
strip = true
lto = true
codegen-units = 1
